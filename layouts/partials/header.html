<header class="site-header">
    <nav>
        <div class="nav-left">
            <a href='{{ "" | absLangURL }}' class="logo"></a>
        </div>

        <div class="nav-links">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | absLangURL }}" class="nav-link">{{ .Name }}</a>
            {{ end }}
        </div>

        <div class="header-controls">
            <button class="search-toggle" title="Search posts">🔍</button>
            <!-- <button class="theme-toggle" title="Toggle dark mode">🌙</button> -->
        </div>
        <div class="nav-menu">
            <button class="menu-btn" type="button">
                <i class="fa fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Sliding Search Form -->
    <div class="search-form-container" id="searchForm">
        <div class="search-form">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search posts..." autocomplete="off">
                <button class="search-submit" type="button">
                    <span>🔍</span>
                </button>
                <button class="search-close" type="button">
                    <span>✕</span>
                </button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>
    <div class="search-results mobile-menu-container" id="mobileMenu">
        {{ range .Site.Menus.main }}
            <div class="search-result-item">
                <a href="{{ .URL | absLangURL }}" target="_parent" class="search-result-title">{{ .Name }}</a>
            </div>
        {{ end }}
    </div>
</header>
